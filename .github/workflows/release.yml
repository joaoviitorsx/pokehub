name: Release

# Fluxo: a tag vX.Y.Z dispara o job "build" (sem permissão de escrita) e depois o job "publish",
# que cria um RASCUNHO de release com os instaladores, latest*.yml, blockmaps e SHA256SUMS.
# O release só vira público quando uma pessoa o revisa e o publica manualmente (não há assinatura de código ainda;
# ver SECURITY.md). Para habilitar a assinatura no futuro (SignPath Foundation ou Azure Trusted Signing), veja
# a seção "Assinatura de código" do SECURITY.md: defina build.win.signtoolOptions.publisherName no package.json.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_script: dist:win
            platform: windows
          - os: ubuntu-latest
            package_script: dist:linux
            platform: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # --publish never: o job de build não tem token nem permissão de escrita; quem publica é o job "publish".
      - run: bun run ${{ matrix.package_script }}
      - name: Conferir Electron Fuses do app empacotado
        run: node scripts/check-fuses.cjs
      - name: Reunir arquivos e gerar SHA256SUMS
        shell: bash
        run: |
          mkdir -p out
          cp release/*.exe release/*.exe.blockmap release/latest.yml out/ 2>/dev/null || true
          cp release/*.AppImage release/latest-linux.yml out/ 2>/dev/null || true
          ls -l out
          test -n "$(ls -A out)"
          (cd out && sha256sum * > ../SHA256SUMS-${{ matrix.platform }}.txt)
          mv SHA256SUMS-${{ matrix.platform }}.txt out/
          cat out/SHA256SUMS-${{ matrix.platform }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pokehub-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish (rascunho)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir tag e versão
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "A tag $GITHUB_REF_NAME não corresponde a v$version (package.json)." >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pokehub-*
          path: assets
          merge-multiple: true
      - name: Unir SHA256SUMS
        working-directory: assets
        run: |
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS
          rm SHA256SUMS-*.txt
          sha256sum --check SHA256SUMS
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'assets/*'
      - name: Criar/atualizar rascunho do release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then echo "O release $GITHUB_REF_NAME já está publicado; não sobrescrevo." >&2; exit 1; fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber assets/*
