name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_script: dist:linux
            artifact_name: pokehub-linux
            artifact_path: release/*.AppImage
          - os: windows-latest
            package_script: dist:win
            artifact_name: pokehub-windows
            artifact_path: release/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Electron smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:electron
      - name: Electron smoke (Windows)
        if: runner.os == 'Windows'
        run: bun run test:electron
      - run: bun run ${{ matrix.package_script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
