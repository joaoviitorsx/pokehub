name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_script: dist:linux
            artifact_name: pokehub-linux
            artifact_path: release/*.AppImage
          - os: windows-latest
            package_script: dist:win
            artifact_name: pokehub-windows
            artifact_path: release/*.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Electron smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:electron
      - name: Electron smoke (Windows)
        if: runner.os == 'Windows'
        run: bun run test:electron
      - run: bun run ${{ matrix.package_script }}
      - name: Conferir Electron Fuses
        run: node scripts/check-fuses.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
