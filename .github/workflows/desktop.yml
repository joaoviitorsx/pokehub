name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package_script: dist:linux
            artifact_name: pokehub-linux
            artifact_path: |
              release/*.AppImage
              release/latest-linux.yml
          - os: windows-latest
            package_script: dist:win
            artifact_name: pokehub-windows
            artifact_path: |
              release/*.exe
              release/latest.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      # o bun não roda o postinstall do pacote electron (dependência não confiável): baixa o binário de desenvolvimento aqui
      - name: 'Baixar o binário do Electron (smoke de desenvolvimento)'
        run: node node_modules/electron/install.js
      - name: 'Dependências de sistema (Linux, Electron sob xvfb)'
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgtk-3-0t64 libatk-bridge2.0-0t64 libgbm1 libasound2t64 libxss1 libxtst6 libcups2t64 libdrm2 libxkbcommon0
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Preparar chrome-sandbox do Electron de desenvolvimento (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Electron smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:electron
      - name: Electron smoke (Windows)
        if: runner.os == 'Windows'
        run: bun run test:electron
      - run: bun run ${{ matrix.package_script }}
      - name: Conferir Electron Fuses
        run: node scripts/check-fuses.cjs
      # O sandbox do Chromium continua LIGADO: o chrome-sandbox do app descompactado precisa ser root:4755 (como o AppImage/instalador faz).
      - name: Preparar chrome-sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Smoke do app empacotado (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:packaged
      - name: Smoke do app empacotado (Windows)
        if: runner.os == 'Windows'
        run: bun run test:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
